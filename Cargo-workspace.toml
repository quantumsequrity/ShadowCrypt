[workspace]
resolver = "2"
members = [
    "core",
    "cli",
    "gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["bloodraven"]
license = "MIT"

[workspace.dependencies]
# Core dependencies
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
flate2 = "1.0"

# Terminal UI (CLI)
crossterm = "0.28"

# GUI dependencies
egui = "0.31"
eframe = "0.31"

# Internal crates
shadowcrypt-core = { path = "core" }

[profile.release]
opt-level = 3
lto = true
