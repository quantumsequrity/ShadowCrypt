[workspace]
resolver = "2"
members = [
    "core",
    "cli",
    "gui",
    "crates/shadowcrypt-agents",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["bloodraven"]
license = "MIT"

[workspace.dependencies]
# Core dependencies
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
flate2 = "1.0"

# Terminal UI (CLI)
crossterm = "0.28"

# GUI dependencies
egui = "0.31"
eframe = "0.31"

# Multi-agent system dependencies
crossbeam = "0.8"
parking_lot = "0.12"
rayon = "1.10"
uuid = { version = "1.0", features = ["v4", "serde"] }
petgraph = "0.6"
indexmap = "2.0"

# Internal crates
shadowcrypt-core = { path = "core" }
shadowcrypt-agents = { path = "crates/shadowcrypt-agents" }

[profile.release]
opt-level = 3
lto = true
