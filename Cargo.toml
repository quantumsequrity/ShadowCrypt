[package]
name = "shadowcrypt"
version = "0.1.0"
edition = "2024"
authors = ["bloodraven"]
license = "MIT"

[[bin]]
name = "shadowcrypt"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
flate2 = "1.0"

[profile.release]
opt-level = 3
lto = true
